plugins {
    alias(libs.plugins.androidLibrary)
    alias(libs.plugins.kotlinMultiplatform)
    alias(libs.plugins.composeMultiplatform)
    alias(libs.plugins.composeCompiler)
    id 'maven-publish'
    // Screenshot testing for documentation (does not affect the published artifact)
    id 'app.cash.paparazzi' version '1.3.5'
}

compose.resources {
    packageOfResClass = "com.capiro.composables.resources"
}

kotlin {
    androidTarget {
        publishLibraryVariants("release")
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }

    // iosX64 (Intel simulator) dropped: Compose Multiplatform 1.11.1 doesn't publish
    // artifacts for it, and this repo only needs Apple Silicon device/simulator targets.
    [iosArm64(), iosSimulatorArm64()].each { target ->
        target.binaries.framework {
            baseName = "composables"
        }
    }

    sourceSets {
        commonMain.dependencies {
            implementation(compose.runtime)
            implementation(compose.foundation)
            implementation(compose.material3)
            implementation(compose.ui)
            implementation(compose.components.resources)
            // Several commonMain composables reference androidx.compose.material.icons.Icons
            // directly (Close, Lock, Visibility/VisibilityOff, DownloadForOffline, ...), so the
            // commonMain metadata compile (used by publishToMavenLocal / JitPack) needs this
            // resolvable from commonMain itself, not just from a platform source set.
            implementation(compose.materialIconsExtended)
            implementation "org.jetbrains.compose.ui:ui-tooling-preview:${libs.versions.composeMultiplatform.get()}"
        }
        androidMain.dependencies {
            // material-icons-extended comes from commonMain's compose.materialIconsExtended
            // (substituted to this exact androidx artifact for the Android target) — declaring
            // it again here caused a Gradle dependency-resolution-result corruption bug.
            implementation libs.androidx.core.ktx
            implementation libs.androidx.appcompat
            implementation libs.material
            implementation libs.androidx.activity.compose

            implementation "androidx.graphics:graphics-shapes:1.0.1"

            // CameraX + ML Kit — power QrScannerDialogCapiro / QrScannerButtonCapiro
            implementation libs.androidx.camera.core
            implementation libs.androidx.camera.camera2
            implementation libs.androidx.camera.lifecycle
            implementation libs.androidx.camera.view
            implementation libs.mlkit.barcode
        }
        androidUnitTest.dependencies {
            implementation libs.junit
        }
        androidInstrumentedTest.dependencies {
            implementation libs.androidx.junit
            implementation libs.androidx.espresso.core
        }
    }
}

android {
    namespace 'com.capiro.composables'
    compileSdk 35

    defaultConfig {
        minSdk 26

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Android Studio interactive @Preview rendering (debug builds only)
    debugImplementation libs.androidx.ui.tooling
}

// Kotlin Multiplatform + maven-publish auto-generates one publication per target
// (androidRelease, iosArm64, iosX64, iosSimulatorArm64) plus a root Gradle-metadata
// publication, instead of the single AAR `components.release` used pre-KMP.
// JitPack serves multi-module builds under com.github.<owner>.<repo>, not the bare owner —
// matching that here keeps a mavenLocal publish resolvable under the same coordinates real
// consumers use, so switching between the two doesn't silently change which artifact resolves.
group = 'com.github.Capiro-Dev.CapiroUI'
version = '2.4.0'
